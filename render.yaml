services:
  # 1. Unified Web Service (React Frontend + Node.js Orchestrator)
  - type: web
    name: deeptrace-web
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: MOCK_MODE
        value: "true"
      - key: AI_SERVICE_URL
        value: ""

  # 2. Python AI Service (FastAPI Forensics Engine - Optional for Real Model Inference)
  - type: web
    name: deeptrace-ai-service
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MOCK_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
